# Portainer stack: Stacks > Add stack > Web editor, paste this, fill in the environment values.
services:
  mail-triage:
    image: ghcr.io/selbereth/mail-triage:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-100}
      GMAIL_ADDRESS: ${GMAIL_ADDRESS}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      BACKEND: ${BACKEND:-}   # empty = claude-cli if CLAUDE_CODE_OAUTH_TOKEN is set, else api
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      APP_USERNAME: ${APP_USERNAME}
      APP_PASSWORD: ${APP_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:-}   # optional: generated on first start and saved in the volume
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      POLL_MINUTES: ${POLL_MINUTES:-30}
      MODEL: ${MODEL:-}
      NTFY_URL: ${NTFY_URL:-}
      # RULES: "multi-line text here"   # optional: replaces the default rules baked into the image
    volumes:
      - triage-data:/data
volumes:
  triage-data:

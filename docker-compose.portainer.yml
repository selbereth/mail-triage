# Portainer stack: Stacks > Add stack > Web editor, paste this, fill in the environment values.
services:
  mail-triage:
    image: ghcr.io/selbereth/mail-triage:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      GMAIL_ADDRESS: ${GMAIL_ADDRESS}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      APP_USERNAME: ${APP_USERNAME}
      APP_PASSWORD: ${APP_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      POLL_MINUTES: ${POLL_MINUTES:-30}
      MODEL: ${MODEL:-claude-opus-5-5}
      NTFY_URL: ${NTFY_URL:-}
      # RULES: "multi-line text here"   # optional: replaces the default rules baked into the image
    volumes:
      - triage-data:/data
volumes:
  triage-data:
